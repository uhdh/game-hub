<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카드체스 - 피의 게임 X 시뮬레이터</title>
<link rel="icon" type="image/png" href="./assets/favicon.png">
<script src="./card-chess-engine.js"></script>
<style>
  :root {
    --bg: #0f0f12;
    --panel: #15181c;
    --panel-light: #1c2024;
    --border: rgba(255,255,255,.08);
    --text: #e7ebee;
    --text-dim: #8992a0;
    --accent: #5fb8b0;
    --accent-hover: #7fcac3;
    --danger: #e0786f;
    --gold: #ffd166;
    --castle: #7c9bff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); min-height: 100vh; }
  a { color: var(--accent); text-decoration: none; }
  #app {
    min-height: 100vh; display: flex; justify-content: center;
    padding: 24px 16px 48px;
    font-family: -apple-system, "Pretendard", "Segoe UI", "Malgun Gothic", sans-serif;
    color: var(--text);
  }
  .col { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 16px; }
  .header-row { display: flex; align-items: center; justify-content: space-between; }
  .home-link { font-size: 12.5px; font-weight: 700; color: var(--text-dim); }
  .title { font-size: 18px; font-weight: 800; }

  .screen { display: flex; flex-direction: column; gap: 16px; }
  .screen.hidden { display: none; }

  .btn-primary { background: var(--accent); color: #0f1214; font-size: 14px; font-weight: 700; border: none; padding: 12px 18px; border-radius: 12px; cursor: pointer; }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-secondary { background: var(--panel-light); color: var(--text); font-size: 13.5px; font-weight: 700; border: 1px solid var(--border); padding: 10px 14px; border-radius: 12px; cursor: pointer; }
  .btn-secondary:disabled { opacity: .4; cursor: not-allowed; }

  .status-bar { text-align: center; font-size: 13px; font-weight: 700; color: var(--gold); min-height: 18px; }

  .table-layout {
    display: grid;
    grid-template-columns: 62px 1fr 62px;
    grid-template-rows: auto auto;
    gap: 10px;
    align-items: center;
    justify-items: center;
  }
  .wait-slot-wrap { grid-column: 1 / 4; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .hand-left { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; gap: 10px; }
  .hand-right { grid-column: 3; grid-row: 2; display: flex; flex-direction: column; gap: 10px; }
  .board-wrap { grid-column: 2; grid-row: 2; }

  .card-slot {
    width: 58px; height: 82px;
    background: var(--panel-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; text-align: center; gap: 4px;
    padding: 4px;
    cursor: default;
  }
  .card-slot.selectable { cursor: pointer; border-color: var(--accent); }
  .card-slot.selected { background: rgba(95,184,176,.22); border-color: var(--accent); }
  .card-slot.unusable { opacity: .4; cursor: default; }
  .card-slot .card-icon { font-size: 18px; }
  img.card-icon { width: 30px; height: 30px; object-fit: contain; }
  .card-slot .card-label-tiny { font-size: 9px; color: var(--text-dim); }

  .board {
    display: grid;
    grid-template-columns: repeat(5, 50px);
    grid-template-rows: repeat(5, 50px);
    gap: 2px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
  }
  .cell {
    background: var(--panel);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .cell.castle { background: rgba(124,155,255,.12); box-shadow: inset 0 0 0 2px rgba(124,155,255,.55); }
  .cell.castle .castle-mark { position: absolute; top: 2px; left: 3px; font-size: 10px; line-height: 1; color: var(--castle); pointer-events: none; }
  .cell.highlight-piece { box-shadow: inset 0 0 0 2px var(--accent); cursor: pointer; }
  .cell.highlight-dest { background: rgba(95,184,176,.22); cursor: pointer; }
  .cell.last-move-from { border: 2px solid var(--gold); }
  .cell.last-move-to { border: 2px solid var(--gold); background: rgba(255,209,102,.16); }
  .piece {
    width: 26px; height: 26px; border-radius: 50% 50% 50% 0;
    border: 2px solid rgba(0,0,0,.3);
  }
  .piece.facing-down { transform: rotate(45deg); }
  .piece.facing-up { transform: rotate(225deg); }
  .piece.owner-P1 { background: #5fb8b0; }
  .piece.owner-P2 { background: #e0786f; }

  .rules-summary { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; font-size: 11.5px; color: var(--text-dim); line-height: 1.6; }

  .log-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .log-title { font-size: 11.5px; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .log-list { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .log-list .log-entry { color: var(--text-dim); }
  .log-list .log-entry.me { color: var(--accent-hover); }
  .log-list .log-entry.ai { color: var(--danger); }
  .log-empty { color: var(--text-dim); font-size: 12px; }

  .modal { position: fixed; inset: 0; background: rgba(6,7,9,.75); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal.hidden { display: none; }
  .modal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px; max-width: 320px; width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: center; }
  .modal-title { font-size: 20px; font-weight: 800; }
  .modal-reason { font-size: 13px; color: var(--text-dim); }
  .modal-note { font-size: 11px; color: var(--text-dim); }
</style>
</head>
<body>
<div id="app">
  <div class="col">
    <div class="header-row">
      <a href="./index.html" class="home-link">← 게임 허브</a>
      <span class="title">카드체스</span>
      <button type="button" class="btn-secondary" id="takeback-btn" style="display:none;">무르기</button>
      <button type="button" class="btn-secondary" id="new-game-btn" style="display:none;">새 게임</button>
    </div>

    <div id="screen-game" class="screen">
      <div class="status-bar" id="status-bar"></div>
      <div class="table-layout">
        <div class="wait-slot-wrap">
          <span class="card-label-tiny">대기</span>
          <div class="card-slot" id="wait-slot"></div>
        </div>
        <div class="hand-left" id="hand-P1"></div>
        <div class="board-wrap">
          <div class="board" id="board"></div>
        </div>
        <div class="hand-right" id="hand-P2"></div>
      </div>
      <div class="rules-summary">
        록: 상하좌우 1칸 · 비숍: 대각선 1칸 · 어태커: 전진 1~2칸/대각선-전진 1칸 · 나이트: 체스 나이트 · 점퍼: 인접 말 넘어 2칸(말 2개 남으면 퀸: 8방향 1칸)
      </div>
      <div class="log-panel">
        <div class="log-title">이동 기록</div>
        <div class="log-list" id="log-list"><div class="log-empty">아직 기록이 없습니다</div></div>
      </div>
    </div>
  </div>
</div>

<div id="win-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title" id="win-title"></div>
    <div class="modal-reason" id="win-reason"></div>
    <div class="modal-note" id="win-note" style="display:none;"></div>
    <button type="button" class="btn-primary" id="win-restart-btn">새 게임</button>
  </div>
</div>

<script>
  const E = window.CardChessEngine;
  const CARD_LABELS = {
    rook: ['./assets/cards/rook.png', '록'],
    bishop: ['./assets/cards/bishop.png', '비숍'],
    attacker: ['./assets/cards/attacker.png', '어태커'],
    knight: ['./assets/cards/knight.png', '나이트'],
    jumper: ['./assets/cards/jumper.png', '점퍼'],
    queen: ['♛', '퀸'],
  };

  function cardDisplay(state, cardId) {
    const kind = (cardId === 'jumper' && state.jumperConverted) ? 'queen' : cardId;
    return CARD_LABELS[kind];
  }

  function iconMarkup(icon) {
    return icon.endsWith('.png')
      ? `<img class="card-icon" src="${icon}" alt="">`
      : `<span class="card-icon">${icon}</span>`;
  }

  let state = null;

  function randomNickname() {
    const pool = ['이상민', '정근우', '박지민', '이태균', '하승진', '현성주', '윤비', '이진형', '홍진호', '서출구', '최혜선', '허성범', '김경훈', '김유현', '김남희', '강지후', '곽범', '이관희', '신승용', '덕후'];
    const word = pool[Math.floor(Math.random() * pool.length)];
    return `${word}#${Math.floor(Math.random() * 999) + 1}`;
  }

  let selection = { cardId: null, from: null };
  let draftState = null; // { pending: string[], self: string[], opponent: string[], picking: 'self'|'opponent' }
  let lastMove = null; // { from: {col,row}, to: {col,row} } | null - 가장 최근 이동(패스 제외)
  let moveLog = []; // { text: string, mine: boolean }[]
  let lastHumanMoveSnapshot = null; // 내 직전 수를 두기 전 state (1회 무르기용)
  let takebackUsed = false; // 이번 판에서 무르기를 썼는지 - 쓰면 랭킹 미등록

  function updateTakebackButton() {
    const btn = document.getElementById('takeback-btn');
    btn.disabled = !lastHumanMoveSnapshot || !!(state && state.winner);
  }

  function logMove(text, mine) {
    moveLog.push({ text: text, mine: mine });
    renderLog();
  }

  function renderLog() {
    const el = document.getElementById('log-list');
    if (!moveLog.length) { el.innerHTML = '<div class="log-empty">아직 기록이 없습니다</div>'; return; }
    el.innerHTML = moveLog.map(function (e) {
      return '<div class="log-entry ' + (e.mine ? 'me' : 'ai') + '">' + e.text + '</div>';
    }).join('');
    el.scrollTop = el.scrollHeight;
  }

  function startGame() {
    const nickname = localStorage.getItem('cardChessNickname') || randomNickname();
    localStorage.setItem('cardChessNickname', nickname);
    window.cardChessNickname = nickname;

    const first = Math.random() < 0.5 ? 'P1' : 'P2';
    state = E.createInitialState(first);
    selection = { cardId: null, from: null };
    lastMove = null;
    moveLog = [];
    renderLog();
    lastHumanMoveSnapshot = null;
    takebackUsed = false;

    document.getElementById('new-game-btn').style.display = '';
    document.getElementById('takeback-btn').style.display = '';
    updateTakebackButton();

    const second = E.other(first);
    if (second === 'P2') {
      const draft = E.chooseAiDraft();
      state = E.applyDraft(state, draft.secondCards, draft.firstCards);
      draftState = null;
      afterStateChange();
    } else {
      draftState = { pending: E.CARD_IDS.slice(), self: [], picking: 'self' };
      render();
    }
  }

  function renderCardSlot(elId, cardId, selectable) {
    const el = document.getElementById(elId);
    if (!cardId) { el.innerHTML = ''; el.classList.remove('selectable', 'selected'); return; }
    const [icon, label] = cardDisplay(state, cardId);
    el.innerHTML = `${iconMarkup(icon)}<span class="card-label-tiny">${label}</span>`;
    el.classList.toggle('selectable', !!selectable);
    el.classList.toggle('selected', selection.cardId === cardId);
  }

  function renderHand(elId, player) {
    const el = document.getElementById(elId);
    el.innerHTML = '';
    (state.hands[player] || []).forEach(function (cardId) {
      const slot = document.createElement('div');
      slot.className = 'card-slot';
      const [icon, label] = cardDisplay(state, cardId);
      slot.innerHTML = `${iconMarkup(icon)}<span class="card-label-tiny">${label}</span>`;
      const isMyTurnCard = player === 'P1' && state.turn === 'P1' && !state.winner;
      if (isMyTurnCard) {
        slot.classList.add('selectable');
        if (selection.cardId === cardId) slot.classList.add('selected');
        if (!selection.cardId && selection.from) {
          const usable = E.getLegalMoves(state, cardId, 'P1').some(function (m) {
            return m.from.col === selection.from.col && m.from.row === selection.from.row;
          });
          if (!usable) slot.classList.add('unusable');
        }
        slot.addEventListener('click', function () { onCardClick(cardId); });
      }
      el.appendChild(slot);
    });
  }

  function onCardClick(cardId) {
    if (selection.from) {
      // 말 먼저 선택된 상태: 이 카드로 그 말을 이동할 수 있을 때만 카드 선택을 완료한다.
      const canMoveThisPiece = E.getLegalMoves(state, cardId, 'P1').some(function (m) {
        return m.from.col === selection.from.col && m.from.row === selection.from.row;
      });
      if (!canMoveThisPiece) return;
      selection.cardId = cardId;
      render();
      return;
    }
    selection = { cardId: cardId, from: null };
    const moves = E.getLegalMoves(state, cardId, 'P1');
    if (moves.length === 0) {
      const otherHasMoves = state.hands.P1.some(function (c) {
        return c !== cardId && E.getLegalMoves(state, c, 'P1').length > 0;
      });
      if (otherHasMoves) {
        window.alert('이 카드로 이동할 수 있는 말이 없습니다. 다른 카드를 사용하세요.');
        selection = { cardId: null, from: null };
        render();
        return;
      }
      const ok = window.confirm('이 카드로 이동할 수 있는 말이 없습니다. 그대로 턴을 넘길까요?');
      if (ok) {
        const label = cardDisplay(state, cardId)[1];
        lastHumanMoveSnapshot = state;
        state = E.applyPass(state, cardId);
        selection = { cardId: null, from: null };
        logMove('나: ' + label + ' - 이동 가능한 수 없음, 턴 넘김', true);
        afterStateChange();
      } else {
        selection = { cardId: null, from: null };
        render();
      }
      return;
    }
    render();
  }

  function onCellClick(col, row) {
    if (state.winner) return;
    if (draftState) return;
    if (state.turn !== 'P1') return;
    if (!selection.cardId) {
      // 카드가 아직 없으면 "말 먼저 선택" 흐름: 내 말이고, 손패 카드 중 하나로라도
      // 이동시킬 수 있는 말일 때만 선택한다.
      const piece = state.pieces.find(function (p) { return p.col === col && p.row === row; });
      if (!piece || piece.owner !== 'P1') return;
      const canMoveWithSomeCard = state.hands.P1.some(function (c) {
        return E.getLegalMoves(state, c, 'P1').some(function (m) { return m.from.col === col && m.from.row === row; });
      });
      if (!canMoveWithSomeCard) return;
      selection.from = (selection.from && selection.from.col === col && selection.from.row === row)
        ? null
        : { col: col, row: row };
      render();
      return;
    }
    const moves = E.getLegalMoves(state, selection.cardId, 'P1');
    if (!selection.from) {
      const hasMoveFromHere = moves.some(function (m) { return m.from.col === col && m.from.row === row; });
      if (hasMoveFromHere) { selection.from = { col: col, row: row }; render(); }
      return;
    }
    const isDest = moves.some(function (m) {
      return m.from.col === selection.from.col && m.from.row === selection.from.row && m.to.col === col && m.to.row === row;
    });
    if (isDest) {
      const label = cardDisplay(state, selection.cardId)[1];
      const captured = !!state.pieces.find(function (p) { return p.col === col && p.row === row; });
      const from = selection.from;
      lastHumanMoveSnapshot = state;
      state = E.applyMove(state, selection.cardId, selection.from, { col: col, row: row });
      selection = { cardId: null, from: null };
      lastMove = { from: from, to: { col: col, row: row } };
      logMove('나: ' + label + ' 이동' + (captured ? ' · 포획!' : ''), true);
      afterStateChange();
    } else {
      selection.from = null;
      render();
    }
  }

  function renderBoard() {
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    const moves = (selection.cardId && !draftState) ? E.getLegalMoves(state, selection.cardId, 'P1') : [];
    const pieceCells = new Set(moves.map(function (m) { return m.from.col + ',' + m.from.row; }));
    const destCells = selection.from ? moves.filter(function (m) {
      return m.from.col === selection.from.col && m.from.row === selection.from.row;
    }).map(function (m) { return m.to.col + ',' + m.to.row; }) : [];

    // 보드는 위아래로 그린다: 내 말(P1, col=0)이 하단, AI 말(P2, col=4)이 상단.
    // 시각 좌표(visualRow: 0=상단..4=하단, visualCol: 0=좌..4=우) -> 엔진 좌표(col,row) 변환:
    //   engineCol = 4 - visualRow, engineRow = visualCol
    for (let visualRow = 0; visualRow < 5; visualRow++) {
      for (let visualCol = 0; visualCol < 5; visualCol++) {
        const col = 4 - visualRow;
        const row = visualCol;
        const cell = document.createElement('div');
        cell.className = 'cell';
        const key = col + ',' + row;
        const isCastle = (E.CASTLE.P1.col === col && E.CASTLE.P1.row === row) || (E.CASTLE.P2.col === col && E.CASTLE.P2.row === row);
        if (isCastle) {
          cell.classList.add('castle');
          const mark = document.createElement('div');
          mark.className = 'castle-mark';
          mark.textContent = '♜';
          cell.appendChild(mark);
        }
        if (!selection.from && pieceCells.has(key)) cell.classList.add('highlight-piece');
        if (!selection.cardId && selection.from && selection.from.col === col && selection.from.row === row) cell.classList.add('highlight-piece');
        if (destCells.indexOf(key) !== -1) cell.classList.add('highlight-dest');
        if (lastMove && lastMove.from.col === col && lastMove.from.row === row) cell.classList.add('last-move-from');
        if (lastMove && lastMove.to.col === col && lastMove.to.row === row) cell.classList.add('last-move-to');
        cell.addEventListener('click', function () { onCellClick(col, row); });
        const piece = state.pieces.find(function (p) { return p.col === col && p.row === row; });
        if (piece) {
          const div = document.createElement('div');
          div.className = 'piece owner-' + piece.owner + ' facing-' + (piece.owner === 'P1' ? 'up' : 'down');
          cell.appendChild(div);
        }
        boardEl.appendChild(cell);
      }
    }
  }

  function renderDraftOverlay() {
    const el = document.getElementById('status-bar');
    if (!draftState) return;
    el.textContent = draftState.picking === 'self'
      ? '카드 5장 중 자신이 가질 카드 2장을 선택하세요'
      : '남은 카드 중 상대(선)에게 줄 카드 2장을 선택하세요';
  }

  function render() {
    renderCardSlot('wait-slot', state.waiting, false);
    renderHand('hand-P1', 'P1');
    renderHand('hand-P2', 'P2');
    renderBoard();
    if (draftState) {
      renderDraftOverlay();
      renderDraftPicker();
    } else {
      document.getElementById('draft-picker') && document.getElementById('draft-picker').remove();
      document.getElementById('status-bar').textContent = state.turn === 'P1' ? '당신의 차례' : 'AI 차례';
    }
    updateTakebackButton();
  }

  function renderDraftPicker() {
    let picker = document.getElementById('draft-picker');
    if (!picker) {
      picker = document.createElement('div');
      picker.id = 'draft-picker';
      picker.style.display = 'flex';
      picker.style.gap = '8px';
      picker.style.justifyContent = 'center';
      picker.style.flexWrap = 'wrap';
      document.getElementById('screen-game').insertBefore(picker, document.querySelector('.table-layout'));
    }
    picker.innerHTML = '';
    draftState.pending.forEach(function (cardId) {
      const slot = document.createElement('div');
      slot.className = 'card-slot selectable';
      const [icon, label] = cardDisplay(state, cardId);
      slot.innerHTML = `${iconMarkup(icon)}<span class="card-label-tiny">${label}</span>`;
      slot.addEventListener('click', function () { onDraftPick(cardId); });
      picker.appendChild(slot);
    });
  }

  function onDraftPick(cardId) {
    if (draftState.picking === 'self') {
      draftState.self.push(cardId);
      draftState.pending = draftState.pending.filter(function (c) { return c !== cardId; });
      if (draftState.self.length === 2) { draftState.picking = 'opponent'; draftState.opponent = []; }
      render();
      return;
    }
    draftState.opponent.push(cardId);
    draftState.pending = draftState.pending.filter(function (c) { return c !== cardId; });
    if (draftState.opponent.length === 2) {
      state = E.applyDraft(state, draftState.self, draftState.opponent);
      draftState = null;
      afterStateChange();
      return;
    }
    render();
  }

  function afterStateChange() {
    render();
    if (state.winner) { showWinModal(); return; }
    if (state.turn === 'P2') scheduleAiTurn();
  }

  let aiTimer = null;

  function scheduleAiTurn() {
    document.getElementById('status-bar').textContent = 'AI가 생각하는 중...';
    aiTimer = setTimeout(function () {
      aiTimer = null;
      const action = E.chooseAiMove(state, 4);
      const label = cardDisplay(state, action.cardId)[1];
      if (action.pass) {
        state = E.applyPass(state, action.cardId);
        logMove('AI: ' + label + ' - 이동 가능한 수 없음, 턴 넘김', false);
      } else {
        const captured = !!state.pieces.find(function (p) { return p.col === action.to.col && p.row === action.to.row; });
        state = E.applyMove(state, action.cardId, action.from, action.to);
        lastMove = { from: action.from, to: action.to };
        logMove('AI: ' + label + ' 이동' + (captured ? ' · 포획!' : ''), false);
      }
      afterStateChange();
    }, 600);
  }

  function cancelAiTimer() {
    if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
  }

  const SUPABASE_URL = 'https://paktzmofotvwfdxcpmzv.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_jWbstEn2pKJTNDxLTR4Jig_asglvzGW';
  const AI_RATING = 1500;
  const K_FACTOR = 32;

  function sbHeaders(extra) {
    return Object.assign({ apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }, extra || {});
  }

  async function fetchPlayerRating(nickname) {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/card_chess_leaderboard?select=nickname,rating,wins,losses&nickname=eq.${encodeURIComponent(nickname)}`,
      { headers: sbHeaders() }
    );
    if (!res.ok) throw new Error('레이팅 조회 실패');
    const rows = await res.json();
    return rows[0] || { nickname, rating: 1200, wins: 0, losses: 0 };
  }

  async function upsertPlayerRating(nickname, rating, wins, losses) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/card_chess_leaderboard?on_conflict=nickname`, {
      method: 'POST',
      headers: sbHeaders({ 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify({ nickname, rating, wins, losses, updated_at: new Date().toISOString() }),
    });
    if (!res.ok) throw new Error('레이팅 등록 실패');
  }

  async function recordResult(won) {
    const nickname = window.cardChessNickname;
    try {
      const existing = await fetchPlayerRating(nickname);
      const newRating = E.computeNewRating(existing.rating, won ? 1 : 0, AI_RATING, K_FACTOR);
      const wins = existing.wins + (won ? 1 : 0);
      const losses = existing.losses + (won ? 0 : 1);
      await upsertPlayerRating(nickname, newRating, wins, losses);
    } catch (e) {
      // 리더보드 기록 실패는 게임 결과 표시를 막지 않는다
    }
  }

  function showWinModal() {
    const won = state.winner === 'P1';
    document.getElementById('win-title').textContent = won ? '승리!' : 'AI 승리';
    document.getElementById('win-reason').textContent = state.winReason === 'elimination'
      ? (won ? '상대 말을 모두 잡았습니다' : 'AI가 당신의 말을 모두 잡았습니다')
      : (won ? '상대 성을 점령하고 버텼습니다' : 'AI가 당신의 성을 점령하고 버텼습니다');
    const noteEl = document.getElementById('win-note');
    if (takebackUsed) {
      noteEl.textContent = '무르기를 사용한 판이라 리더보드에는 반영되지 않습니다.';
      noteEl.style.display = '';
    } else {
      noteEl.style.display = 'none';
    }
    document.getElementById('win-modal').classList.remove('hidden');
    if (!takebackUsed) recordResult(won);
  }

  document.getElementById('win-restart-btn').addEventListener('click', function () {
    cancelAiTimer();
    document.getElementById('win-modal').classList.add('hidden');
    startGame();
  });

  document.getElementById('takeback-btn').addEventListener('click', function () {
    if (!lastHumanMoveSnapshot) return;
    cancelAiTimer();
    state = lastHumanMoveSnapshot;
    lastHumanMoveSnapshot = null;
    takebackUsed = true;
    selection = { cardId: null, from: null };
    lastMove = null;
    logMove('무르기 사용 (직전 내 수를 취소했습니다)', true);
    render();
  });

  document.getElementById('new-game-btn').addEventListener('click', function () {
    cancelAiTimer();
    startGame();
  });

  startGame();
</script>
</body>
</html>
