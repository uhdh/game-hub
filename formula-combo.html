<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>수식 콤보</title>
    <script>
      (() => {
        const api = 'https://paktzmofotvwfdxcpmzv.supabase.co/rest/v1/formula_combo_leaderboard';
        const key = 'sb_publishable_jWbstEn2pKJTNDxLTR4Jig_asglvzGW';
        const headers = { apikey: key, Authorization: `Bearer ${key}` };
        const nativeFetch = window.fetch.bind(window);
        const esc = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const normalizeScore = () => {
          const line = document.querySelector('.total-score-line');
          if (!line) return;
          const match = line.textContent.match(/총점\s*\(([-\d,.]+)\s*-\s*[-\d,.]+\)\s*[×x]\s*(\d+)\s*=\s*[-\d,.]+/);
          if (!match) return;
          const comboPoints = Number(match[1].replace(/,/g, ''));
          const combos = Number(match[2]);
          line.dataset.comboPoints = comboPoints;
          line.dataset.combos = combos;
          line.textContent = `최종점수 ${comboPoints} × ${combos} = ${comboPoints * combos}`;
        };
        const getScoreParts = () => {
          const normalized = document.querySelector('.total-score-line');
          if (normalized?.dataset.comboPoints) return { comboPoints: Number(normalized.dataset.comboPoints), combos: Number(normalized.dataset.combos) };
          const line = document.querySelector('.total-score-line')?.textContent || '';
          const match = line.match(/총점\s*\(([-\d,.]+)\s*-\s*[-\d,.]+\)\s*[×x]\s*(\d+)\s*=\s*[-\d,.]+/);
          if (!match) return null;
          return { comboPoints: Number(match[1].replace(/,/g, '')), combos: Number(match[2]) };
        };
        const getReplay = parts => ({
          mode: document.querySelector('.sample-card') ? 'sample' : 'new_game',
          comboPoints: parts.comboPoints,
          combos: parts.combos,
          scoreFormula: `${parts.comboPoints.toLocaleString('ko-KR')} × ${parts.combos} = ${(parts.comboPoints * parts.combos).toLocaleString('ko-KR')}`,
          comboCounts: getComboCounts(),
          board: getBoardLayout(),
          snapshot: document.querySelector('.board-card')?.innerText?.slice(0, 4000) || ''
        });
        const getComboCounts = () => {
          const counts = {};
          document.querySelectorAll('.combo-log .log-row small').forEach(row => {
            const match = row.textContent.match(/(\d+)\s+zeros/);
            if (match) { const key = String(10 ** Number(match[1])); counts[key] = (counts[key] || 0) + 1; }
          });
          return counts;
        };
        const getBoardLayout = () => {
          const board = document.querySelector('.hex-board');
          if (!board) return null;
          return { width: board.style.width, height: board.style.height, tiles: [...board.querySelectorAll('.hex-slot')].map(slot => { const tile = slot.querySelector('.hex-tile'); return tile ? { style: slot.getAttribute('style') || '', label: tile.querySelector('strong')?.textContent || '', removed: tile.classList.contains('removed') } : null; }).filter(Boolean) };
        };
        const renderReplayChallenge = (panel, top, replay, mode, countText) => {
          if (!replay?.board?.tiles?.length) { panel.innerHTML = `<strong>1위 기보 · ${mode} · ${esc(top.nickname)}</strong><p>${replay?.scoreFormula || `${(top.combo_points || Math.round(top.score / Math.max(1, top.combos))).toLocaleString('ko-KR')} × ${top.combos} = ${Number(top.score).toLocaleString('ko-KR')}`} · ${Number(top.score).toLocaleString('ko-KR')}점</p><p>${countText}</p><pre>${esc(replay?.snapshot || '이전 기록에는 배치 데이터가 없습니다.')}</pre>`; return; }
          panel.innerHTML = `<strong>1위 기보 도전 · ${mode} · ${esc(top.nickname)}</strong><p>${replay.scoreFormula || ''} · ${countText}</p><div class="replay-challenge"><div class="replay-challenge-status">타일을 눌러 같은 배치에서 콤보를 만들어보세요.</div><div class="replay-board-wrap"><div class="replay-board"></div></div><button type="button" class="replay-reset">선택 초기화</button></div>`;
          const board = panel.querySelector('.replay-board');
          board.style.width = replay.board.width || '760px'; board.style.height = replay.board.height || '544px';
          const status = panel.querySelector('.replay-challenge-status');
          const selected = [];
          const parse = label => { const op = label[0]; const value = Number(label.slice(1).replace(/[()]/g, '')); return { op, value }; };
          const evaluate = path => path.slice(1).reduce((value, tile) => { const { op, value: amount } = parse(tile.label); return op === '+' ? value + amount : op === '−' || op === '-' ? value - amount : op === '×' ? value * amount : amount ? value / amount : value; }, parse(path[0].label).value);
          const power = value => Number.isInteger(value) && value >= 10 && Math.abs(Math.log10(value) - Math.round(Math.log10(value))) < 1e-9;
          const refresh = () => { board.querySelectorAll('.replay-tile').forEach((el, index) => el.classList.toggle('selected', selected.includes(index))); };
          replay.board.tiles.forEach((data, index) => { const tile = document.createElement('button'); tile.type = 'button'; tile.className = 'replay-tile'; tile.textContent = data.label; tile.setAttribute('style', data.style); tile.dataset.left = (data.style.match(/left:\s*([\d.]+)/)?.[1] || '0'); tile.dataset.top = (data.style.match(/top:\s*([\d.]+)/)?.[1] || '0'); tile.onclick = () => { if (selected.includes(index)) return; if (selected.length) { const prev = replay.board.tiles[selected[selected.length - 1]]; const dx = Number(tile.dataset.left) - Number(prev.style.match(/left:\s*([\d.]+)/)?.[1] || 0); const dy = Number(tile.dataset.top) - Number(prev.style.match(/top:\s*([\d.]+)/)?.[1] || 0); if (Math.hypot(dx, dy) > 60) { status.textContent = '인접한 타일만 이어갈 수 있습니다.'; return; } } selected.push(index); refresh(); const path = selected.map(i => replay.board.tiles[i]); const result = evaluate(path); status.textContent = `${path.map(item => item.label).join(' ')} = ${result.toLocaleString('ko-KR')}`; if (selected.length > 1 && power(result)) status.textContent += ' · 콤보 완성 가능'; }; board.append(tile); });
          panel.querySelector('.replay-reset').onclick = () => { selected.splice(0, selected.length); refresh(); status.textContent = '타일을 눌러 같은 배치에서 콤보를 만들어보세요.'; };
        };
        const isValidEntry = entry => Number.isInteger(Number(entry.combos)) && Number(entry.combos) >= 0 && Number(entry.combos) <= 75 && Number(entry.combo_points) >= 0 && Number(entry.score) === Number(entry.combo_points) * Number(entry.combos);
        const refreshLeaderboardFormula = async () => {
          try {
            const response = await nativeFetch(`${api}?select=nickname,score,combos,combo_points,combo_counts,replay&order=score.desc,created_at.asc&limit=1000`, { headers });
            const entries = (await response.json()).filter(isValidEntry);
            document.querySelectorAll('.leaderboard-row').forEach((row, index) => {
              row.hidden = index >= 10;
              const entry = entries[index];
              if (!entry) return;
              const points = entry.combo_points || (entry.combos ? Math.round(entry.score / entry.combos) : 0);
              const small = row.querySelector('small');
              const score = row.querySelector('b');
              if (small) small.textContent = `${points}점 × ${entry.combos}콤보`;
              if (score) score.textContent = `= ${entry.score.toLocaleString('ko-KR')}점`;
              let source = row.querySelector('.formula-source');
              if (!source) { source = document.createElement('em'); source.className = 'formula-source'; row.append(source); }
              source.textContent = entry.replay?.mode === 'sample' ? '강지후 샘플' : '새 게임';
              let counts = row.querySelector('.formula-counts');
              if (!counts) { counts = document.createElement('span'); counts.className = 'formula-counts'; row.append(counts); }
              const comboCounts = entry.combo_counts || entry.replay?.comboCounts;
              counts.textContent = comboCounts ? ['10', '100', '1,000', '10,000', '100,000', '1,000,000'].map(label => `${label} ${comboCounts[label.replace(/,/g, '')] || 0}개`).join(' · ') : '달성 콤보 집계 없음';
            });
          } catch (_) {}
        };
        const refreshMyRank = async rank => {
          try {
            const nickname = window.localStorage.getItem('formulaComboNickname');
            const response = await nativeFetch(`${api}?select=nickname,score,combos,combo_points&order=score.desc,created_at.asc`, { headers });
            const entries = (await response.json()).filter(isValidEntry);
            const position = entries.findIndex(entry => entry.nickname === nickname);
            rank.textContent = position >= 0 ? `내 순위 ${position + 1}위 · ${Number(entries[position].score).toLocaleString('ko-KR')}점` : '내 순위 미등록';
          } catch (_) { rank.textContent = '내 순위 확인 실패'; }
        };
        window.fetch = async (input, init = {}) => {
          const target = typeof input === 'string' ? input : input?.url || '';
          if (target.startsWith(api) && init.body && (init.method === 'POST' || init.method === 'PATCH')) {
            try {
              const body = JSON.parse(init.body);
              const parts = getScoreParts();
              if (parts) {
                body.combo_points = parts.comboPoints;
                body.score = parts.comboPoints * Number(body.combos || parts.combos);
                if (body.score > 100000) {
                  body.replay = getReplay({ ...parts, combos: Number(body.combos || parts.combos) });
                  body.combo_counts = body.replay.comboCounts;
                } else {
                  body.replay = null;
                  body.combo_counts = null;
                }
                init = { ...init, body: JSON.stringify(body) };
              }
            } catch (_) {}
          }
          return nativeFetch(input, init);
        };
        const mount = () => {
          normalizeScore();
          const head = document.querySelector('.leaderboard-head');
          const card = document.querySelector('.leaderboard-card');
          if (!head || !card || document.getElementById('formula-replay-tab')) return;
          const button = document.createElement('button');
          button.id = 'formula-replay-tab';
          button.type = 'button';
          button.textContent = '1위 기보';
          const rank = document.createElement('small');
          rank.id = 'formula-my-rank';
          rank.textContent = '내 순위 확인 중…';
          head.append(rank);
          const panel = document.createElement('div');
          panel.id = 'formula-replay-panel';
          panel.hidden = true;
          panel.innerHTML = '<strong>1위 기보</strong><p>불러오는 중입니다.</p>';
          head.append(button);
          card.append(panel);
          setTimeout(refreshLeaderboardFormula, 600);
          refreshMyRank(rank);
          button.onclick = async () => {
            panel.hidden = !panel.hidden;
            if (panel.hidden) return;
            panel.innerHTML = '<strong>1위 기보</strong><p>불러오는 중입니다.</p>';
            try {
              const response = await nativeFetch(`${api}?select=nickname,score,combos,combo_points,combo_counts,replay&order=score.desc,created_at.asc&limit=1000`, { headers });
              const [top] = (await response.json()).filter(isValidEntry);
              if (!top) { panel.innerHTML = '<strong>1위 기보</strong><p>등록된 기보가 없습니다.</p>'; return; }
              const replay = top.replay;
              const mode = replay?.mode === 'sample' ? '강지후 샘플' : '새 게임';
              const comboCounts = top.combo_counts || replay?.comboCounts;
              const countText = comboCounts ? ['10', '100', '1,000', '10,000', '100,000', '1,000,000'].map(label => `${label} ${comboCounts[label.replace(/,/g, '')] || 0}개`).join(' · ') : '달성 콤보 집계 없음';
              renderReplayChallenge(panel, top, replay, mode, countText);
            } catch (_) { panel.innerHTML = '<strong>1위 기보</strong><p>기보를 불러오지 못했습니다.</p>'; }
          };
        };
        const formulaSolver = (() => {
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const parseLabel = label => {
            const text = String(label || '').replace(/\s+/g, '');
            const op = text[0];
            const value = Number(text.slice(1).replace(/[()]/g, ''));
            return { op, value };
          };
          const apply = (value, tile) => tile.op === '+' ? value + tile.value : tile.op === '-' || tile.op === '−' ? value - tile.value : tile.op === '×' ? value * tile.value : tile.value ? value / tile.value : value;
          const isPower = value => Number.isInteger(value) && value >= 10 && Math.log10(value) % 1 === 0;
          const zeroCount = value => String(Math.abs(Math.trunc(value))).replace(/[^0]/g, '').length;
          const board = () => [...document.querySelectorAll('.hex-board .hex-slot')].map((slot, index) => {
            const el = slot.querySelector('.hex-tile');
            if (!el) return null;
            const rect = slot.getBoundingClientRect();
            return { index, el, tile: parseLabel(el.querySelector('strong')?.textContent || el.textContent), x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, removed: el.classList.contains('removed') };
          }).filter(Boolean);
          const neighbours = nodes => nodes.map((node, i) => nodes.map((other, j) => i !== j && Math.hypot(node.x - other.x, node.y - other.y) <= 75 ? j : -1).filter(j => j >= 0));
          const findBest = (nodes, graph, start) => {
            let best = null;
            const beam = [{ at: start, value: nodes[start].tile.value, path: [start] }];
            for (let depth = 1; depth <= 14 && beam.length; depth++) {
              const next = [];
              for (const state of beam) for (const to of graph[state.at]) {
                if (state.path.includes(to) || nodes[to].removed) continue;
                const value = apply(state.value, nodes[to].tile);
                const path = [...state.path, to];
                if (path.length > 1 && isPower(value)) {
                  const score = path.length * zeroCount(value);
                  if (!best || score > best.score || score === best.score && path.length > best.path.length) best = { path, value, score };
                }
                if (Number.isFinite(value) && Math.abs(value) <= 1000000) next.push({ at: to, value, path });
              }
              next.sort((a, b) => (Math.abs(b.value) === Math.abs(a.value) ? b.path.length - a.path.length : Math.abs(a.value) - Math.abs(b.value)));
              beam.splice(0, beam.length, ...next.slice(0, 700));
            }
            return best;
          };
          const clickPath = async (nodes, path) => {
            for (const index of path) { nodes[index].el.click(); await sleep(28); }
            const declare = [...document.querySelectorAll('button.combo-button')].find(button => !button.classList.contains('retry-button') && !button.disabled);
            if (declare) { declare.click(); await sleep(45); return true; }
            return false;
          };
          const solve = async status => {
            const nodes = board();
            if (nodes.length < 2 || document.querySelector('.tray-stack .tray-tile')) { status.textContent = '먼저 타일 배치를 완료하세요.'; return; }
            const graph = neighbours(nodes);
            let completed = 0;
            for (let round = 0; round < nodes.length; round++) {
              const current = board();
              const currentGraph = neighbours(current);
              let best = null;
              current.forEach((node, start) => { if (!node.removed) { const candidate = findBest(current, currentGraph, start); if (candidate && (!best || candidate.score > best.score || candidate.score === best.score && candidate.path.length > best.path.length)) best = candidate; } });
              if (!best) break;
              if (!(await clickPath(current, best.path))) break;
              completed += 1;
              status.textContent = `자동 솔버 진행 중 · ${completed}콤보 · 최근 결과 ${best.value.toLocaleString('ko-KR')}`;
              await sleep(70);
            }
            status.textContent = `자동 솔버 완료 · ${completed}콤보`;
          };
          const placeAll = async status => {
            let placed = 0;
            for (let i = 0; i < 75; i++) {
              const source = document.querySelector('.tray-stack .tray-tile');
              const target = document.querySelector('.hex-board .hex-slot:not(.occupied)');
              if (!source || !target) break;
              const props = element => { const key = Object.keys(element).find(name => name.startsWith('__reactProps')); return key ? element[key] : null; };
              props(source)?.onDragStart?.();
              await sleep(35);
              const freshTarget = document.querySelector('.hex-board .hex-slot:not(.occupied)');
              props(freshTarget)?.onDrop?.({ preventDefault() {} });
              placed += 1;
              status.textContent = `자동 배치 중 · ${placed}/75`;
              await sleep(90);
            }
            const finish = [...document.querySelectorAll('button')].find(button => button.textContent.includes('배치 완료'));
            if (finish) { finish.click(); await sleep(120); }
            status.textContent = `자동 배치 완료 · ${placed}개`;
          };
          const mount = () => {
            if (document.getElementById('formula-solver-controls')) return;
            const head = document.querySelector('.topbar');
            if (!head) return;
            const controls = document.createElement('div');
            controls.id = 'formula-solver-controls';
            controls.innerHTML = '<button type="button" data-solver-place>자동 배치</button><button type="button" data-solver-run>솔버 실행</button><span data-solver-status>개발용 자동 플레이</span>';
            head.append(controls);
            const status = controls.querySelector('[data-solver-status]');
            controls.querySelector('[data-solver-place]').onclick = () => placeAll(status);
            controls.querySelector('[data-solver-run]').onclick = () => solve(status);
          };
          return mount;
        })();
        let adminSolverDecision = null;
        const mountFormulaSolver = () => {
          if (adminSolverDecision === false || adminSolverDecision === true) {
            if (adminSolverDecision === true) formulaSolver();
            return;
          }
          const password = window.sessionStorage.getItem('bloodGameXAdminPw');
          if (!password) { adminSolverDecision = false; return; }
          adminSolverDecision = fetch('https://paktzmofotvwfdxcpmzv.supabase.co/rest/v1/rpc/admin_check_password', {
            method: 'POST',
            headers: { apikey: key, Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ p_password: password })
          }).then(response => response.ok ? response.json() : false).then(valid => {
            adminSolverDecision = valid === true;
            if (adminSolverDecision) formulaSolver();
            return adminSolverDecision;
          }).catch(() => { adminSolverDecision = false; return false; });
        };
        let modeSwitchBypass = false;
        document.addEventListener('click', event => {
          if (modeSwitchBypass) return;
          const button = event.target.closest('button');
          const label = button?.textContent.trim();
          if (label !== '강지후 샘플' && label !== '샘플 닫기') return;
          event.preventDefault();
          event.stopPropagation();
          const newGame = [...document.querySelectorAll('button')].find(item => item.textContent.trim() === '새 게임');
          modeSwitchBypass = true;
          newGame?.click();
          modeSwitchBypass = false;
          if (label === '강지후 샘플') setTimeout(() => {
            const sample = [...document.querySelectorAll('button')].find(item => item.textContent.trim() === '강지후 샘플');
            modeSwitchBypass = true;
            sample?.click();
            modeSwitchBypass = false;
          }, 0);
        }, true);
        let replayResetBypass = false;
        document.addEventListener('click', async event => {
          const button = event.target.closest('button.retry-button');
          if (replayResetBypass || !button || button.textContent.trim() !== '다시 하기') return;
          event.preventDefault();
          event.stopPropagation();
          const restart = [...document.querySelectorAll('button')].find(item => item.textContent.trim() === '새 게임');
          if (button.closest('.sample-card')) {
            restart?.click();
            setTimeout(() => [...document.querySelectorAll('button')].find(item => item.textContent.trim() === '강지후 샘플')?.click(), 0);
          } else {
            let remaining = 0;
            const readComboCount = () => Number(document.querySelector('.combo-log .log-head b')?.textContent.match(/\d+/)?.[0] || 0);
            while ((remaining = readComboCount()) > 0) {
              const undo = [...document.querySelectorAll('button.retry-button')].find(item => item.textContent.trim() === '되돌리기');
              if (!undo) break;
              replayResetBypass = true;
              undo.click();
              replayResetBypass = false;
              await new Promise(resolve => setTimeout(resolve, 25));
            }
            replayResetBypass = true;
            button.click();
            replayResetBypass = false;
          }
        }, true);
        const style = document.createElement('style');
        style.textContent = '#formula-replay-tab{margin-left:auto;border:1px solid #70c7b5;border-radius:8px;background:transparent;color:#70c7b5;padding:6px 9px;font:inherit;font-size:11px;font-weight:800;cursor:pointer}#formula-my-rank{color:#e2b653;font-size:10px;font-weight:800;margin-left:auto;margin-right:8px}#formula-replay-panel{margin-top:10px;padding:12px;border-top:1px solid rgba(255,255,255,.08);color:#eef3f4;font-size:12px}#formula-replay-panel p{color:#70c7b5;margin:8px 0}#formula-replay-panel pre{max-height:180px;overflow:auto;white-space:pre-wrap;color:#aab4bd;font:11px/1.5 ui-monospace,monospace}.formula-source{font-style:normal;color:#e2b653;font-size:10px;font-weight:800;white-space:nowrap}.formula-counts{color:#8992a0;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.replay-board-wrap{overflow:auto;margin:10px -4px;padding:4px}.replay-board{position:relative;min-width:640px;background:#11181e;border-radius:10px}.replay-tile{position:absolute;box-sizing:border-box;border:1px solid #536471;border-radius:8px;background:#26333b;color:#eef3f4;font:800 13px/1 ui-monospace,monospace;cursor:pointer}.replay-tile:hover,.replay-tile.selected{background:#2d8f88;border-color:#b9fff2;color:#fff}.replay-challenge-status{color:#70c7b5;font-size:11px}.replay-reset{margin-top:8px;border:1px solid #536471;border-radius:7px;background:transparent;color:#aab4bd;padding:6px 9px;font-size:10px;cursor:pointer}#formula-solver-controls{display:flex;align-items:center;gap:6px;margin-left:8px;flex-wrap:wrap}#formula-solver-controls button{border:1px solid #70c7b5;border-radius:7px;background:#16252a;color:#b9fff2;padding:5px 8px;font:inherit;font-size:10px;font-weight:800;cursor:pointer}#formula-solver-controls span{color:#8992a0;font-size:10px}';
        document.head.append(style);
        new MutationObserver(mount).observe(document.documentElement, { childList: true, subtree: true });
        setTimeout(mount, 0);
        new MutationObserver(mountFormulaSolver).observe(document.documentElement, { childList: true, subtree: true });
        setTimeout(mountFormulaSolver, 0);
      })();
    </script>
    <script type="module" crossorigin src="./assets/formula-combo/formula-combo-BP32ypKH.js"></script>
